<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PhotoFind Pro — Your Album</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#E8C87A;--gold2:#C9A84C;--gold3:#A07830;
  --cream:#FDF8F0;--ivory:#F5EDD8;--parchment:#EDE0C4;
  --dark:#0C0A07;--dark2:#1A1408;--ink:#2A1E0E;
  --rose:#C8899A;--sage:#8BA888;--slate:#6B8B9E;
}

html,body{width:100%;height:100%;overflow:hidden}

body{
  font-family:'Montserrat',sans-serif;
  background:var(--dark);
  display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-tap-highlight-color:transparent;
}

/* ══ LOADING ══ */
#loading{
  position:fixed;inset:0;z-index:9999;
  background:var(--dark);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
}
.ld-brand{
  font-family:'Playfair Display',serif;
  font-size:38px;font-weight:900;
  color:white;letter-spacing:-0.02em;
  margin-bottom:4px;
}
.ld-brand em{color:var(--gold);font-style:normal}
.ld-tag{font-size:9px;color:rgba(232,200,122,0.4);letter-spacing:0.4em;text-transform:uppercase;margin-bottom:32px}
.ld-bar{width:160px;height:1.5px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
.ld-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold3),var(--gold),var(--gold2));transition:width 0.2s}
.ld-status{font-size:10px;color:rgba(255,255,255,0.2);margin-top:12px;letter-spacing:0.15em}

/* ══ STAGE ══ */
#stage{
  display:none;
  width:100vw;height:100vh;
  position:relative;
  align-items:center;justify-content:center;
  flex-direction:column;
  overflow:hidden;
}

/* Ambient background */
#stage::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 20% 30%,rgba(232,200,122,0.04),transparent 40%),
    radial-gradient(ellipse at 80% 70%,rgba(200,137,154,0.03),transparent 40%);
}

/* ══ BOOK ══ */
.book-container{
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;
}

.book{
  width:min(320px,88vw);
  height:min(460px,65vh);
  position:relative;
  perspective:2400px;
}

/* Book shadow layers */
.book-shadow{
  position:absolute;
  bottom:-18px;left:6%;right:6%;height:18px;
  background:radial-gradient(ellipse at 50% 0,rgba(0,0,0,0.5),transparent 70%);
  border-radius:50%;
}
.book-shadow2{
  position:absolute;
  bottom:-30px;left:12%;right:12%;height:15px;
  background:radial-gradient(ellipse at 50% 0,rgba(0,0,0,0.2),transparent 70%);
  border-radius:50%;
}

/* Book spine */
.book-spine{
  position:absolute;
  top:4px;bottom:4px;left:0;width:12px;
  background:linear-gradient(90deg,#2A1A08,#3A2A10,#2A1A08);
  border-radius:2px 0 0 2px;
  box-shadow:inset -2px 0 4px rgba(0,0,0,0.3);
  z-index:300;
}

/* ══ PAGES ══ */
.page{
  position:absolute;inset:0;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 0.9s cubic-bezier(0.4,0,0.2,1);
  cursor:pointer;
}
.page.flipped{transform:rotateY(-180deg)}

.page-f,.page-b{
  position:absolute;inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
}
.page-f{
  border-radius:1px 10px 10px 1px;
  box-shadow:2px 0 15px rgba(0,0,0,0.2),inset -1px 0 0 rgba(0,0,0,0.1);
}
.page-b{
  transform:rotateY(180deg);
  border-radius:10px 1px 1px 10px;
  box-shadow:-2px 0 15px rgba(0,0,0,0.2),inset 1px 0 0 rgba(0,0,0,0.1);
}

/* Page edge shimmer on flip */
.page-f::after{
  content:'';position:absolute;
  top:0;right:0;bottom:0;width:40px;
  background:linear-gradient(-90deg,rgba(0,0,0,0.08),transparent);
  pointer-events:none;z-index:1;
}

/* ══ COVER PAGE ══ */
.cover{
  width:100%;height:100%;
  position:relative;overflow:hidden;
  background:var(--dark2);
}

/* Wedding theme: Deep navy + gold */
.cover.wedding{
  background:linear-gradient(140deg,#0D0A1A 0%,#1A0F2E 40%,#0A0C1A 70%,#120A0A 100%);
}
/* Birthday theme */
.cover.birthday{
  background:linear-gradient(140deg,#0A1A0A 0%,#0F2A1A 40%,#0A1A2A 100%);
}
/* Corporate theme */
.cover.corporate{
  background:linear-gradient(140deg,#0A0A1A 0%,#0F1A2A 100%);
}

/* Decorative orbs */
.cover-orb1,.cover-orb2,.cover-orb3{
  position:absolute;border-radius:50%;pointer-events:none;
}
.cover.wedding .cover-orb1{
  width:220px;height:220px;top:-60px;right:-60px;
  background:radial-gradient(circle,rgba(100,60,180,0.2),transparent 70%);
}
.cover.wedding .cover-orb2{
  width:180px;height:180px;bottom:-40px;left:-40px;
  background:radial-gradient(circle,rgba(180,100,120,0.15),transparent 70%);
}
.cover.wedding .cover-orb3{
  width:120px;height:120px;top:40%;left:20%;
  background:radial-gradient(circle,rgba(232,200,122,0.06),transparent 70%);
}

/* Geometric decorations */
.cover-geo{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.cover-geo::before{
  content:'';position:absolute;
  top:12px;left:12px;right:12px;bottom:12px;
  border:0.5px solid rgba(232,200,122,0.12);
  border-radius:2px;
}
.cover-geo::after{
  content:'';position:absolute;
  top:18px;left:18px;right:18px;bottom:18px;
  border:0.5px solid rgba(232,200,122,0.06);
  border-radius:2px;
}

/* Top decorative line */
.cover-topline{
  position:absolute;top:0;left:0;right:0;height:2.5px;
  background:linear-gradient(90deg,transparent,var(--gold3),var(--gold),var(--gold2),var(--gold),var(--gold3),transparent);
}

/* Cover content */
.cover-content{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:28px 20px;
  text-align:center;
}

/* Mandala / decorative circle */
.cover-mandala{
  width:130px;height:130px;
  position:relative;margin-bottom:16px;
}
.cover-photo-ring{
  position:absolute;inset:0;
  border-radius:50%;
  border:1px solid rgba(232,200,122,0.25);
  box-shadow:
    0 0 0 6px rgba(232,200,122,0.04),
    0 0 0 12px rgba(232,200,122,0.02),
    0 0 40px rgba(232,200,122,0.08),
    inset 0 0 20px rgba(0,0,0,0.3);
}
.cover-photo-inner{
  position:absolute;
  top:8px;left:8px;right:8px;bottom:8px;
  border-radius:50%;overflow:hidden;
  border:1.5px solid rgba(232,200,122,0.3);
}
.cover-photo-inner img,.cover-photo-ph{
  width:100%;height:100%;object-fit:cover;
}
.cover-photo-ph{
  background:linear-gradient(135deg,#1A1208,#2A1A10);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;
}

/* Decorative dots around circle */
.cover-dots{
  position:absolute;inset:-8px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 0%,var(--gold) 1.5px,transparent 1.5px),
    radial-gradient(circle at 100% 50%,var(--gold) 1.5px,transparent 1.5px),
    radial-gradient(circle at 50% 100%,var(--gold) 1.5px,transparent 1.5px),
    radial-gradient(circle at 0% 50%,var(--gold) 1.5px,transparent 1.5px),
    radial-gradient(circle at 85% 15%,rgba(232,200,122,0.5) 1px,transparent 1px),
    radial-gradient(circle at 15% 85%,rgba(232,200,122,0.5) 1px,transparent 1px),
    radial-gradient(circle at 85% 85%,rgba(232,200,122,0.5) 1px,transparent 1px),
    radial-gradient(circle at 15% 15%,rgba(232,200,122,0.5) 1px,transparent 1px);
}

.cover-eyebrow{
  font-size:8px;letter-spacing:0.5em;text-transform:uppercase;
  color:rgba(232,200,122,0.45);font-weight:500;
  margin-bottom:10px;
}

.cover-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(18px,5vw,26px);
  font-weight:900;color:white;
  line-height:1.05;margin-bottom:5px;
  text-shadow:0 2px 20px rgba(0,0,0,0.5);
}

.cover-subtitle{
  font-family:'Cormorant Garamond',serif;
  font-size:13px;font-style:italic;
  color:rgba(232,200,122,0.65);
  margin-bottom:4px;
}

.cover-date{
  font-size:9px;color:rgba(255,255,255,0.25);
  letter-spacing:0.25em;text-transform:uppercase;
  margin-bottom:16px;
}

.cover-divider{
  display:flex;align-items:center;gap:8px;
  margin-bottom:16px;width:100%;justify-content:center;
}
.cover-divider-line{
  height:0.5px;width:30px;
  background:linear-gradient(90deg,transparent,rgba(232,200,122,0.4));
}
.cover-divider-line.r{
  background:linear-gradient(-90deg,transparent,rgba(232,200,122,0.4));
}
.cover-divider-diamond{
  width:5px;height:5px;
  background:var(--gold);
  transform:rotate(45deg);
}

.cover-stats{
  display:flex;gap:20px;
}
.cover-stat{text-align:center}
.cover-stat-val{
  font-family:'Playfair Display',serif;
  font-size:20px;font-weight:700;color:var(--gold);
  line-height:1;
}
.cover-stat-lbl{
  font-size:7.5px;color:rgba(255,255,255,0.25);
  letter-spacing:0.15em;text-transform:uppercase;
  margin-top:2px;
}

.cover-botline{
  position:absolute;bottom:0;left:0;right:0;height:2.5px;
  background:linear-gradient(90deg,transparent,var(--gold3),var(--gold),var(--gold2),var(--gold),var(--gold3),transparent);
}

/* ══ PHOTO PAGES ══ */
.pp{
  width:100%;height:100%;
  background:var(--ivory);
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}

/* Subtle paper texture */
.pp::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 20% 20%,rgba(180,140,80,0.03) 0%,transparent 50%),
    radial-gradient(circle at 80% 80%,rgba(180,140,80,0.02) 0%,transparent 50%);
}

/* Page fold top-right corner */
.pp::after{
  content:'';position:absolute;top:0;right:0;
  width:0;height:0;
  border-style:solid;
  border-width:22px 22px 0 0;
  border-color:var(--parchment) transparent transparent transparent;
  filter:drop-shadow(-1px 1px 1px rgba(0,0,0,0.08));
}

/* ── FULL BLEED HERO ── */
.layout-hero .pp-img{
  flex:1;position:relative;overflow:hidden;
}
.layout-hero .pp-img img{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(0.97);
}

/* Hero caption overlay */
.layout-hero .pp-caption-overlay{
  position:absolute;bottom:0;left:0;right:0;
  padding:24px 16px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,0.45));
}
.layout-hero .caption-text{
  font-family:'Cormorant Garamond',serif;
  font-size:13px;font-style:italic;
  color:rgba(255,255,255,0.85);text-align:center;
}

/* ── MAGAZINE LAYOUT ── */
.layout-mag{
  display:grid;
  grid-template-columns:3fr 2fr;
  grid-template-rows:1fr 1fr;
  gap:4px;flex:1;
}
.layout-mag .ps{position:relative;overflow:hidden}
.layout-mag .ps img{width:100%;height:100%;object-fit:cover}
.layout-mag .ps.main{grid-row:span 2}
.layout-mag .ps.accent{
  border-left:2px solid white;
}

/* ── TRIPTYCH ── */
.layout-tri{
  display:grid;
  grid-template-columns:1fr 1.4fr 1fr;
  gap:3px;flex:1;
}
.layout-tri .ps{position:relative;overflow:hidden}
.layout-tri .ps img{width:100%;height:100%;object-fit:cover}
.layout-tri .ps.center{border-left:2px solid white;border-right:2px solid white}

/* ── DIPTYCH ── */
.layout-dipt{
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:4px;flex:1;
}
.layout-dipt .ps{position:relative;overflow:hidden}
.layout-dipt .ps img{width:100%;height:100%;object-fit:cover}
.layout-dipt .ps:first-child{border-bottom:2px solid white}

/* ── POLAROID LAYOUT ── */
.layout-polaroid{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:10px;
  background:var(--parchment);
  position:relative;
}
.polaroid{
  background:white;
  padding:8px 8px 28px;
  box-shadow:0 4px 20px rgba(0,0,0,0.12),0 1px 4px rgba(0,0,0,0.08);
  transform:rotate(-1.5deg);
  width:85%;
  position:relative;
}
.polaroid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.polaroid-caption{
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-size:11px;font-style:italic;
  color:rgba(0,0,0,0.4);
  padding-top:6px;
}
.polaroid2{
  position:absolute;
  background:white;
  padding:6px 6px 20px;
  box-shadow:0 3px 15px rgba(0,0,0,0.1);
  transform:rotate(3deg);
  width:50%;
  bottom:16px;right:10px;
  z-index:2;
}
.polaroid2 img{width:100%;aspect-ratio:1;object-fit:cover;display:block}

/* ── CINEMATIC ── */
.layout-cinematic{
  flex:1;
  position:relative;overflow:hidden;
  background:black;
}
.layout-cinematic .ps{
  position:absolute;inset:0;
}
.layout-cinematic .ps img{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(0.85) contrast(1.1);
}
/* Letterbox bars */
.layout-cinematic::before,.layout-cinematic::after{
  content:'';position:absolute;left:0;right:0;height:30px;
  background:black;z-index:1;
}
.layout-cinematic::before{top:0}
.layout-cinematic::after{bottom:0}

/* ── EDITORIAL ── */
.layout-editorial{
  flex:1;display:flex;
}
.editorial-main{flex:1.5;position:relative;overflow:hidden}
.editorial-main img{width:100%;height:100%;object-fit:cover}
.editorial-side{
  flex:1;
  background:var(--dark2);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:12px 10px;gap:8px;
}
.editorial-num{
  font-family:'Playfair Display',serif;
  font-size:40px;font-weight:900;
  color:rgba(232,200,122,0.15);
  line-height:1;
}
.editorial-quote{
  font-family:'Cormorant Garamond',serif;
  font-size:10px;font-style:italic;
  color:rgba(255,255,255,0.35);
  text-align:center;line-height:1.6;
}
.editorial-gold-line{
  width:30px;height:0.5px;
  background:rgba(232,200,122,0.3);
}

/* PAGE HEADER & FOOTER */
.pp-header{
  padding:7px 12px 6px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:0.5px solid rgba(160,120,48,0.15);
  flex-shrink:0;
  position:relative;z-index:1;
}
.pp-event{
  font-family:'Cormorant Garamond',serif;
  font-size:9px;font-style:italic;color:rgba(160,120,48,0.6);
}
.pp-num{
  font-size:8px;color:rgba(160,120,48,0.35);
  letter-spacing:0.12em;font-weight:500;
}

.pp-footer{
  padding:5px 12px 7px;
  border-top:0.5px solid rgba(160,120,48,0.1);
  flex-shrink:0;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:space-between;
}
.pp-caption{
  font-family:'Cormorant Garamond',serif;
  font-size:9.5px;font-style:italic;
  color:rgba(120,90,40,0.55);
}
.pp-logo{
  font-size:7px;color:rgba(160,120,48,0.25);
  letter-spacing:0.1em;
}

/* ══ BACK COVER ══ */
.back-cover{
  width:100%;height:100%;
  background:linear-gradient(220deg,#0D0A1A,#0A0C1A,#120A0A);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;text-align:center;
  position:relative;overflow:hidden;
}
.back-cover::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(232,200,122,0.04),transparent 60%);
}
.bc-topline,.bc-botline{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold3),var(--gold),var(--gold3),transparent);
}
.bc-topline{top:0}.bc-botline{bottom:0}
.bc-brand{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:900;color:white;
  position:relative;z-index:1;
}
.bc-brand em{color:var(--gold);font-style:normal}
.bc-tag{font-size:8px;color:rgba(255,255,255,0.18);letter-spacing:0.25em;text-transform:uppercase;margin-top:5px;position:relative;z-index:1}
.bc-div{width:40px;height:0.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto;position:relative;z-index:1}
.bc-url{font-size:9px;color:rgba(232,200,122,0.3);letter-spacing:0.2em;position:relative;z-index:1}

/* ══ PROGRESS ══ */
#progressWrap{
  width:min(320px,88vw);
  margin-top:10px;position:relative;
}
#progressTrack{
  width:100%;height:2px;
  background:rgba(255,255,255,0.06);
  border-radius:2px;overflow:hidden;
  position:relative;
}
#progressFill{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--gold3),var(--gold));
  border-radius:2px;transition:width 0.6s ease;
  position:relative;
}
#progressFill::after{
  content:'';position:absolute;right:0;top:-1px;
  width:4px;height:4px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 6px var(--gold);
}

/* ══ CONTROLS ══ */
#controls{
  display:flex;align-items:center;gap:10px;
  margin-top:12px;
}

.ctrl{
  width:36px;height:36px;
  background:rgba(255,255,255,0.05);
  border:0.5px solid rgba(232,200,122,0.15);
  border-radius:50%;
  color:rgba(232,200,122,0.7);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;
}
.ctrl:active{background:rgba(232,200,122,0.1);transform:scale(0.9)}
.ctrl:disabled{opacity:0.2;cursor:default}

#playBtn{
  width:50px;height:50px;
  background:linear-gradient(135deg,var(--gold3),var(--gold),var(--gold2));
  border:none;border-radius:50%;
  color:var(--dark);font-size:18px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(232,200,122,0.25),0 0 0 4px rgba(232,200,122,0.06);
  transition:all 0.15s;
}
#playBtn:active{transform:scale(0.92)}

.pg-ind{
  font-size:9px;color:rgba(255,255,255,0.25);
  letter-spacing:0.1em;min-width:70px;text-align:center;
}

/* ══ TITLE ══ */
#titleBar{
  text-align:center;margin-bottom:12px;
  position:relative;z-index:1;
}
.tb-name{
  font-family:'Playfair Display',serif;
  font-size:16px;font-weight:700;color:white;
  letter-spacing:0.02em;
}
.tb-sub{
  font-size:8px;color:rgba(232,200,122,0.35);
  letter-spacing:0.25em;text-transform:uppercase;margin-top:3px;
}

/* ══ BOTTOM ══ */
#bottom{
  display:flex;align-items:center;gap:8px;margin-top:10px;
}
.bot-btn{
  padding:6px 13px;border-radius:14px;
  border:0.5px solid rgba(232,200,122,0.15);
  background:rgba(255,255,255,0.03);
  color:rgba(255,255,255,0.4);
  font-family:'Montserrat',sans-serif;font-size:9px;font-weight:500;
  cursor:pointer;
  display:flex;align-items:center;gap:4px;
  transition:all 0.15s;letter-spacing:0.05em;
}
.bot-btn:active{background:rgba(232,200,122,0.08)}
.bot-wa{
  background:rgba(37,211,102,0.07);
  border-color:rgba(37,211,102,0.2);
  color:rgba(37,211,102,0.7);
}

/* Speed */
#speedInfo{
  font-size:8px;color:rgba(255,255,255,0.2);
  text-align:center;margin-top:6px;
  letter-spacing:0.12em;
}

/* ══ BGM ══ */
#bgmPill{
  position:fixed;top:14px;right:14px;z-index:500;
  background:rgba(10,8,6,0.7);backdrop-filter:blur(10px);
  border:0.5px solid rgba(232,200,122,0.15);
  border-radius:20px;padding:5px 12px;
  display:none;align-items:center;gap:6px;
  cursor:pointer;transition:all 0.2s;
}
.bgm-bars{display:flex;align-items:flex-end;gap:1.5px;height:12px}
.bgm-bar{
  width:2.5px;border-radius:2px;
  background:var(--gold);
  animation:eq 1.2s ease infinite;
}
.bgm-bar:nth-child(1){height:6px;animation-delay:0s}
.bgm-bar:nth-child(2){height:10px;animation-delay:0.2s}
.bgm-bar:nth-child(3){height:8px;animation-delay:0.1s}
.bgm-bar:nth-child(4){height:12px;animation-delay:0.3s}
.bgm-bar:nth-child(5){height:7px;animation-delay:0.15s}
@keyframes eq{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}
.bgm-bar.paused{animation:none;transform:scaleY(0.3);background:rgba(255,255,255,0.2)}
.bgm-text{font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:0.1em}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="ld-brand">Photo<em>Find</em> Pro</div>
  <div class="ld-tag">Digital Album</div>
  <div class="ld-bar"><div class="ld-fill" id="ldFill"></div></div>
  <div class="ld-status" id="ldStatus">Loading your memories...</div>
</div>

<!-- BGM PILL -->
<div id="bgmPill" onclick="toggleBGM()">
  <div class="bgm-bars">
    <div class="bgm-bar" id="b1"></div>
    <div class="bgm-bar" id="b2"></div>
    <div class="bgm-bar" id="b3"></div>
    <div class="bgm-bar" id="b4"></div>
    <div class="bgm-bar" id="b5"></div>
  </div>
  <span class="bgm-text" id="bgmText">BGM</span>
</div>

<!-- STAGE -->
<div id="stage">
  <div id="titleBar">
    <div class="tb-name" id="tbName">Your Album</div>
    <div class="tb-sub" id="tbSub">DIGITAL PHOTO BOOK</div>
  </div>

  <div class="book-container">
    <div class="book" id="book">
      <div class="book-spine"></div>
    </div>
    <div class="book-shadow"></div>
    <div class="book-shadow2"></div>
  </div>

  <div id="progressWrap">
    <div id="progressTrack"><div id="progressFill"></div></div>
  </div>

  <div id="controls">
    <button class="ctrl" id="prevBtn" onclick="manualPrev()" disabled>‹</button>
    <button class="ctrl" onclick="changeSpeed(-1)" title="Slower">−</button>
    <button id="playBtn" onclick="togglePlay()">▶</button>
    <button class="ctrl" onclick="changeSpeed(1)" title="Faster">+</button>
    <button class="ctrl" id="nextBtn" onclick="manualNext()">›</button>
  </div>

  <div class="pg-ind" id="pgInd">Cover</div>
  <div id="speedInfo">Auto · 4s / page</div>

  <div id="bottom">
    <button class="bot-btn" onclick="shareAlbum()">🔗 Share</button>
    <button class="bot-btn bot-wa" onclick="waShare()">💬 WhatsApp</button>
  </div>
</div>

<audio id="bgm" loop></audio>

<script>
const SERVER = 'https://api.templecity.digital';
const params = new URLSearchParams(window.location.search);
const eventId = params.get('event');
const eventType = params.get('type') || detectType();

function detectType(){
  const h = window.location.href.toLowerCase();
  if(h.includes('wed')||h.includes('marr')) return 'wedding';
  if(h.includes('birth')||h.includes('bday')) return 'birthday';
  if(h.includes('corp')||h.includes('conf')) return 'corporate';
  return 'wedding';
}

// State
let pages=[], currentPage=0, isPlaying=false, playTimer=null;
let allPhotos=[], eventName='', eventDate='';
let bgmPlaying=false, touchStartX=0;
let speedIdx=2;
const speeds=[2000,3000,4000,5000,7000];
const speedLabels=['2s','3s','4s','5s','7s'];

// Captions by theme
const captions={
  wedding:[
    'Two souls, one beautiful journey ♥',
    'Where love stories are written...',
    'Every glance, a lifetime of love',
    'The beginning of forever',
    'Joy uncontained, love unbounded',
    'This is what happiness looks like',
    'A day written in golden light',
    'Hearts full, memories made',
    'In this moment, everything is perfect',
    'Love, laughter & forever after',
  ],
  birthday:[
    'Another year of beautiful moments',
    'Life is a celebration — celebrate it!',
    'Joy multiplied by everyone here',
    'Making memories that last forever',
    'The party of a lifetime',
  ],
  corporate:[
    'Together, we build something great',
    'Moments that define us',
    'Excellence captured in time',
    'The faces behind the success',
  ],
};

function getCaption(idx){
  const pool=captions[eventType]||captions.wedding;
  return pool[idx%pool.length];
}

// Loading
let prog=0;
const ldTimer=setInterval(()=>{
  prog=Math.min(prog+Math.random()*8,85);
  document.getElementById('ldFill').style.width=prog+'%';
},200);

async function init(){
  try{
    if(!eventId){showErr('No event specified');return;}
    document.getElementById('ldStatus').textContent='Fetching your album...';

    const evRes=await fetch(`${SERVER}/events`);
    const evData=await evRes.json();
    const ev=evData.events?.find(e=>e.id===eventId);
    if(ev){
      const raw=ev.name.split('__')[0].replace(/^\d{4}-\d{2}-\d{2}_/,'').replace(/-/g,' ');
      eventName=raw;
      eventDate=parseDate(ev.name);
      document.getElementById('tbName').textContent=eventName;
      document.getElementById('tbSub').textContent=eventDate+' · DIGITAL PHOTO BOOK';
    }

    document.getElementById('ldStatus').textContent='Loading photos...';
    const phRes=await fetch(`${SERVER}/photos/${eventId}`);
    const phData=await phRes.json();
    allPhotos=phData.photos||[];
    if(!allPhotos.length){showErr('No photos in this album yet');return;}

    document.getElementById('ldStatus').textContent='Building your album...';
    buildBook();
    setupInteraction();

    document.getElementById('ldStatus').textContent='Starting BGM...';
    await initBGM();

    clearInterval(ldTimer);
    document.getElementById('ldFill').style.width='100%';
    setTimeout(()=>{
      document.getElementById('loading').style.opacity='0';
      document.getElementById('loading').style.transition='opacity 0.8s';
      setTimeout(()=>{
        document.getElementById('loading').style.display='none';
        document.getElementById('stage').style.display='flex';
        // Auto play after 1s
        setTimeout(()=>startPlay(),1000);
      },800);
    },500);

  }catch(e){showErr(e.message);}
}

// ── BUILD BOOK ──
function buildBook(){
  const book=document.getElementById('book');
  // Remove existing pages (keep spine)
  [...book.querySelectorAll('.page')].forEach(p=>p.remove());
  pages=[];

  // Cover page
  const cover=makePg(0);
  cover.innerHTML=`
    <div class="page-f">
      ${buildCover()}
    </div>
    <div class="page-b">
      ${buildPhotoPage(0,1,'hero')}
    </div>`;
  book.appendChild(cover);
  pages.push(cover);

  // Photo pages
  let idx=1,pgNum=1;
  const layouts=['hero','mag','tri','editorial','dipt','polaroid','cinematic','mag','hero','tri'];

  while(idx<allPhotos.length){
    const pg=makePg(pgNum);
    const li=pgNum%layouts.length;
    const frontLayout=layouts[li];
    const backLayout=layouts[(li+3)%layouts.length];

    const frontCount=photosForLayout(frontLayout);
    const remaining=allPhotos.length-idx;
    const actualFront=Math.min(frontCount,remaining);

    const frontHTML=buildPhotoPage(idx,pgNum*2,frontLayout,actualFront);
    idx+=actualFront;

    const remaining2=allPhotos.length-idx;
    let backHTML='';
    if(remaining2>0){
      const backCount=photosForLayout(backLayout);
      const actualBack=Math.min(backCount,remaining2);
      backHTML=buildPhotoPage(idx,pgNum*2+1,backLayout,actualBack);
      idx+=actualBack;
    }else{
      backHTML=buildBackCover();
    }

    pg.innerHTML=`<div class="page-f">${frontHTML}</div><div class="page-b">${backHTML}</div>`;
    book.appendChild(pg);
    pages.push(pg);
    pgNum++;
  }

  // Final back cover if missing
  if(!book.querySelector('.back-cover')){
    const lastPg=makePg(pgNum);
    lastPg.innerHTML=`
      <div class="page-f">
        <div class="pp">
          <div class="pp-header"><div class="pp-event">${eventName}</div><div class="pp-num">FIN</div></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--parchment);gap:10px">
            <div style="font-family:'Playfair Display',serif;font-size:28px;font-style:italic;color:rgba(120,90,40,0.35)">The End</div>
            <div style="font-size:10px;color:rgba(120,90,40,0.25);letter-spacing:0.12em">${allPhotos.length} memories</div>
          </div>
          <div class="pp-footer"><div class="pp-caption">Thank you for being here ♥</div></div>
        </div>
      </div>
      <div class="page-b">${buildBackCover()}</div>`;
    book.appendChild(lastPg);
    pages.push(lastPg);
  }

  updateNav();
}

function makePg(idx){
  const p=document.createElement('div');
  p.className='page';
  p.style.zIndex=300-idx;
  return p;
}

function photosForLayout(l){
  if(l==='hero'||l==='cinematic'||l==='polaroid') return 1;
  if(l==='dipt'||l==='editorial') return 2;
  if(l==='tri'||l==='mag') return 3;
  return 1;
}

function buildCover(){
  const first=allPhotos[0];
  const themeClass=eventType;
  return `<div class="cover ${themeClass}">
    <div class="cover-geo"></div>
    <div class="cover-orb1"></div>
    <div class="cover-orb2"></div>
    <div class="cover-orb3"></div>
    <div class="cover-topline"></div>
    <div class="cover-content">
      <div class="cover-eyebrow">✦ Personal Album ✦</div>
      <div class="cover-mandala">
        <div class="cover-dots"></div>
        <div class="cover-photo-ring"></div>
        <div class="cover-photo-inner">
          ${first?`<img src="${first.thumbnailLink}" onerror="this.parentElement.innerHTML='<div class=cover-photo-ph>📸</div>'">`:'<div class="cover-photo-ph">📸</div>'}
        </div>
      </div>
      <div class="cover-title">${eventName}</div>
      <div class="cover-subtitle">${getEventSubtitle()}</div>
      <div class="cover-date">${eventDate}</div>
      <div class="cover-divider">
        <div class="cover-divider-line"></div>
        <div class="cover-divider-diamond"></div>
        <div class="cover-divider-line r"></div>
      </div>
      <div class="cover-stats">
        <div class="cover-stat">
          <div class="cover-stat-val">${allPhotos.length}</div>
          <div class="cover-stat-lbl">Memories</div>
        </div>
      </div>
    </div>
    <div class="cover-botline"></div>
  </div>`;
}

function buildBackCover(){
  return `<div class="back-cover">
    <div class="bc-topline"></div>
    <div class="bc-botline"></div>
    <div class="bc-brand">Photo<em>Find</em> Pro</div>
    <div class="bc-tag">Odisha's First AI Photo Delivery</div>
    <div class="bc-div"></div>
    <div class="bc-url">www.templecity.digital</div>
  </div>`;
}

function buildPhotoPage(startIdx,pageNum,layout,count){
  count=count||photosForLayout(layout);
  const photos=allPhotos.slice(startIdx,startIdx+count);
  if(!photos.length) return buildBackCover();

  const cap=getCaption(startIdx);
  const pn=String(pageNum).padStart(2,'0');

  let inner='';

  if(layout==='hero'&&photos[0]){
    inner=`<div class="layout-hero" style="flex:1;position:relative;overflow:hidden">
      <div class="pp-img" style="position:absolute;inset:0">
        <img src="${photos[0].thumbnailLink}" style="width:100%;height:100%;object-fit:cover">
      </div>
      <div class="layout-hero pp-caption-overlay">
        <div class="caption-text">${cap}</div>
      </div>
    </div>`;
  } else if(layout==='mag'&&photos.length>=3){
    inner=`<div class="layout-mag" style="flex:1">
      <div class="ps main"><img src="${photos[0].thumbnailLink}" loading="lazy"></div>
      <div class="ps accent"><img src="${photos[1].thumbnailLink}" loading="lazy"></div>
      <div class="ps accent"><img src="${photos[2].thumbnailLink}" loading="lazy"></div>
    </div>`;
  } else if(layout==='tri'&&photos.length>=3){
    inner=`<div class="layout-tri" style="flex:1">
      <div class="ps"><img src="${photos[0].thumbnailLink}" loading="lazy"></div>
      <div class="ps center"><img src="${photos[1].thumbnailLink}" loading="lazy"></div>
      <div class="ps"><img src="${photos[2].thumbnailLink}" loading="lazy"></div>
    </div>`;
  } else if(layout==='dipt'&&photos.length>=2){
    inner=`<div class="layout-dipt" style="flex:1">
      <div class="ps"><img src="${photos[0].thumbnailLink}" loading="lazy"></div>
      <div class="ps"><img src="${photos[1].thumbnailLink}" loading="lazy"></div>
    </div>`;
  } else if(layout==='editorial'&&photos.length>=2){
    const editorialNum=String(startIdx+1).padStart(2,'0');
    inner=`<div class="layout-editorial" style="flex:1">
      <div class="editorial-main"><img src="${photos[0].thumbnailLink}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="editorial-side">
        <div class="editorial-num">${editorialNum}</div>
        <div class="editorial-gold-line"></div>
        <div class="editorial-quote">${cap}</div>
        <div class="editorial-gold-line"></div>
        ${photos[1]?`<div style="width:100%;aspect-ratio:1;overflow:hidden;border-radius:4px"><img src="${photos[1].thumbnailLink}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>`:''}
      </div>
    </div>`;
  } else if(layout==='polaroid'&&photos[0]){
    inner=`<div class="layout-polaroid" style="flex:1">
      <div class="polaroid">
        <img src="${photos[0].thumbnailLink}" loading="lazy">
        <div class="polaroid-caption">${cap}</div>
      </div>
    </div>`;
  } else if(layout==='cinematic'&&photos[0]){
    inner=`<div class="layout-cinematic" style="flex:1">
      <div class="ps"><img src="${photos[0].thumbnailLink}" loading="lazy"></div>
    </div>`;
  } else if(photos[0]){
    // Fallback
    inner=`<div style="flex:1;position:relative;overflow:hidden">
      <img src="${photos[0].thumbnailLink}" style="width:100%;height:100%;object-fit:cover" loading="lazy">
    </div>`;
  }

  return `<div class="pp">
    <div class="pp-header">
      <div class="pp-event">${eventName}</div>
      <div class="pp-num">${pn}</div>
    </div>
    ${inner}
    <div class="pp-footer">
      <div class="pp-caption">${layout!=='hero'?cap:''}</div>
      <div class="pp-logo">PhotoFind Pro</div>
    </div>
  </div>`;
}

function getEventSubtitle(){
  const subs={
    wedding:'A Wedding to Remember Forever',
    birthday:'A Birthday to Celebrate',
    corporate:'Corporate Event Memories',
  };
  return subs[eventType]||'A Collection of Beautiful Memories';
}

// ── FLIP ──
function nextPage(){
  if(currentPage>=pages.length-1) return false;
  pages[currentPage].classList.add('flipped');
  currentPage++;
  updateNav();
  return true;
}
function prevPage(){
  if(currentPage<=0) return;
  currentPage--;
  pages[currentPage].classList.remove('flipped');
  updateNav();
}
function manualNext(){stopPlay();nextPage();}
function manualPrev(){stopPlay();prevPage();}

function updateNav(){
  const total=pages.length-1;
  const pct=total>0?(currentPage/total)*100:0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('prevBtn').disabled=currentPage===0;
  document.getElementById('nextBtn').disabled=currentPage>=pages.length-1;
  const ind=document.getElementById('pgInd');
  if(currentPage===0) ind.textContent='Cover';
  else if(currentPage>=pages.length-1) ind.textContent='The End';
  else ind.textContent=`Page ${currentPage} of ${pages.length-1}`;
}

// ── AUTOPLAY ──
function startPlay(){
  if(isPlaying) return;
  isPlaying=true;
  document.getElementById('playBtn').textContent='⏸';
  playTimer=setInterval(()=>{
    const ok=nextPage();
    if(!ok) stopPlay();
  },speeds[speedIdx]);
}
function stopPlay(){
  isPlaying=false;
  document.getElementById('playBtn').textContent='▶';
  clearInterval(playTimer);playTimer=null;
}
function togglePlay(){isPlaying?stopPlay():startPlay();}

function changeSpeed(d){
  speedIdx=Math.max(0,Math.min(speeds.length-1,speedIdx+d));
  document.getElementById('speedInfo').textContent=`Auto · ${speedLabels[speedIdx]} / page`;
  if(isPlaying){stopPlay();startPlay();}
}

// ── TOUCH & SWIPE ──
function setupInteraction(){
  const book=document.getElementById('book');
  book.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});
  book.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchStartX;
    if(Math.abs(dx)>40){stopPlay();dx<0?nextPage():prevPage();}
  },{passive:true});
  book.addEventListener('click',e=>{
    const r=book.getBoundingClientRect();
    const x=e.clientX-r.left;
    if(x>r.width*0.65){stopPlay();nextPage();}
    else if(x<r.width*0.35){stopPlay();prevPage();}
    else togglePlay();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){stopPlay();nextPage();}
    else if(e.key==='ArrowLeft'){stopPlay();prevPage();}
    else if(e.key===' '){e.preventDefault();togglePlay();}
  });
}

// ── BGM ──
async function initBGM(){
  try{
    const audio=document.getElementById('bgm');
    // Royalty free BGM from pixabay fallback
    const bgmMap={
      wedding:'https://cdn.pixabay.com/audio/2022/08/04/audio_2dde668d05.mp3',
      birthday:'https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a73467.mp3',
      corporate:'https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3',
    };
    audio.src=bgmMap[eventType]||bgmMap.wedding;
    audio.volume=0.22;
    document.getElementById('bgmPill').style.display='flex';
    // Try autoplay
    try{
      await audio.play();
      bgmPlaying=true;
      document.getElementById('bgmText').textContent='BGM';
    }catch(e){
      bgmPlaying=false;
      document.getElementById('bgmText').textContent='▶ BGM';
      ['b1','b2','b3','b4','b5'].forEach(id=>document.getElementById(id).classList.add('paused'));
    }
  }catch(e){}
}

function toggleBGM(){
  const audio=document.getElementById('bgm');
  const bars=['b1','b2','b3','b4','b5'].map(id=>document.getElementById(id));
  if(bgmPlaying){
    audio.pause();bgmPlaying=false;
    document.getElementById('bgmText').textContent='▶ BGM';
    bars.forEach(b=>b.classList.add('paused'));
  }else{
    audio.play().then(()=>{
      bgmPlaying=true;
      document.getElementById('bgmText').textContent='BGM';
      bars.forEach(b=>b.classList.remove('paused'));
    }).catch(()=>{});
  }
}

// ── SHARE ──
function shareAlbum(){
  const url=window.location.href;
  if(navigator.share) navigator.share({title:`${eventName} Album`,url});
  else navigator.clipboard.writeText(url).then(()=>alert('Link copied!'));
}
function waShare(){
  const msg=`📸 *${eventName} — My Photo Album*\n\n🎬 View my cinematic digital album:\n${window.location.href}\n\n_PhotoFind Pro · www.templecity.digital_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
}

// ── HELPERS ──
function parseDate(n){
  const m=n.match(/^(\d{4}-\d{2}-\d{2})/);
  if(m) return new Date(m[1]).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
  return '2026';
}
function showErr(msg){
  clearInterval(ldTimer);
  document.getElementById('loading').innerHTML=`<div style="text-align:center;padding:40px"><div style="font-size:44px;margin-bottom:16px">📷</div><div style="color:white;font-size:16px;margin-bottom:8px">Album not found</div><div style="color:rgba(255,255,255,0.3);font-size:12px">${msg}</div></div>`;
}

init();
</script>
</body>
</html>
