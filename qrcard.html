<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PhotoFind Pro — QR Card Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Dancing+Script:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#C9A84C;--gold2:#E8C87A;--dark:#0C0A07;--rose:#C84A6A;--cream:#FDF6EC}
body{font-family:'Montserrat',sans-serif;background:var(--dark);color:white;min-height:100vh}

.header{padding:12px 16px;background:rgba(12,10,7,0.98);border-bottom:0.5px solid rgba(232,200,122,0.12);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:'Playfair Display',serif;font-size:15px;font-weight:900}
.logo em{color:var(--gold2);font-style:normal}
.badge{background:linear-gradient(135deg,#8B1A4A,#C84A7A);font-size:8px;font-weight:700;color:white;padding:3px 10px;border-radius:8px;letter-spacing:0.1em}

.wrap{max-width:500px;margin:0 auto;padding:16px 14px 80px}

.sec-title{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(232,200,122,0.5);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:0.5px;background:linear-gradient(90deg,rgba(232,200,122,0.2),transparent)}

/* Template grid */
.tmpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tc{border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all 0.2s;aspect-ratio:3/4;position:relative}
.tc.sel{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(232,200,122,0.15)}
.tc:active{transform:scale(0.96)}
.tc-inner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;position:relative;overflow:hidden}
.tc-name{font-size:9px;font-weight:700;position:relative;z-index:1}
.tc-style{font-size:7px;letter-spacing:0.08em;opacity:0.6;position:relative;z-index:1}
.tc-check{position:absolute;top:6px;right:6px;width:16px;height:16px;background:var(--gold2);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:8px;color:var(--dark);font-weight:900;z-index:2}
.tc.sel .tc-check{display:flex}

/* Input */
.form-group{margin-bottom:10px}
.form-label{font-size:9px;color:rgba(255,255,255,0.35);margin-bottom:4px;display:block;letter-spacing:0.08em;text-transform:uppercase}
.form-input{width:100%;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 12px;color:white;font-family:'Montserrat',sans-serif;font-size:12px;outline:none;transition:all 0.2s}
.form-input:focus{border-color:rgba(232,200,122,0.3)}
.form-input::placeholder{color:rgba(255,255,255,0.18)}

/* Canvas */
.canvas-wrap{border-radius:12px;overflow:hidden;border:0.5px solid rgba(232,200,122,0.15);margin-bottom:14px;background:var(--cream)}
#qrCanvas{width:100%;display:block}

/* Buttons */
.action-btns{display:flex;flex-direction:column;gap:8px}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:0.05em}
.btn:active{transform:scale(0.98)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark)}
.btn-row{display:flex;gap:8px}
.btn-ghost{flex:1;padding:11px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5)}
.btn-wa{flex:1;padding:11px;background:rgba(37,211,102,0.08);border:0.5px solid rgba(37,211,102,0.2);color:rgba(37,211,102,0.75)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(232,200,122,0.95);color:var(--dark);padding:7px 16px;border-radius:14px;font-size:11px;font-weight:700;z-index:999;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap}
.toast.show{opacity:1}

#loadingOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.lo-spin{width:36px;height:36px;border:2px solid rgba(232,200,122,0.2);border-top-color:var(--gold2);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:8px">
    <div class="logo">Photo<em>Find</em> Pro</div>
    <div class="badge">◈ QR CARD DESIGNER</div>
  </div>
</div>

<div class="wrap">

  <!-- Event Details -->
  <div class="sec-title" style="margin-top:4px">✦ Event Details</div>
  <div class="form-group">
    <label class="form-label">Event / Couple Name</label>
    <input class="form-input" id="eventName" placeholder="e.g. Priya & Arjun Wedding" value="Sharma Wedding">
  </div>
  <div class="form-group">
    <label class="form-label">Event URL (auto-filled from dashboard)</label>
    <input class="form-input" id="eventUrl" placeholder="https://www.templecity.digital/?event=...">
  </div>

  <!-- Templates -->
  <div class="sec-title">✦ Choose Template</div>
  <div class="tmpl-grid" id="tmplGrid"></div>

  <!-- Preview -->
  <div class="sec-title">✦ Preview</div>
  <div class="canvas-wrap">
    <canvas id="qrCanvas"></canvas>
  </div>

  <!-- Actions -->
  <div class="action-btns">
    <button class="btn btn-gold" onclick="downloadCard()">⬇ Download High-Quality Card</button>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="copyLink()">🔗 Copy Link</button>
      <button class="btn btn-wa" onclick="shareWA()">💬 WhatsApp</button>
    </div>
  </div>

</div>

<div id="loadingOverlay">
  <div class="lo-spin"></div>
  <div style="font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.15em">Generating card...</div>
</div>

<div class="toast" id="toast"></div>

<script>
// Get params from URL (when opened from dashboard)
const params = new URLSearchParams(window.location.search);
if(params.get('event')) {
  document.getElementById('eventUrl').value = `https://www.templecity.digital/?event=${params.get('event')}`;
}
if(params.get('name')) {
  document.getElementById('eventName').value = decodeURIComponent(params.get('name'));
}

let selectedTemplate = 'floral-cream';

// Templates matching the reference images
const TEMPLATES = [
  {
    id:'floral-cream',
    name:'Floral Cream',
    style:'Wedding Classic',
    previewBg:'linear-gradient(135deg,#FDF6EC,#F5E6D8)',
    previewAcc:'#C84A6A',
    previewIcon:'🌸',
    // Card design config
    bg:'#FDF6EC',
    bgGrad:['#FDF6EC','#F9EDE0','#FDF6EC'],
    titleColor:'#C84A6A',
    accentColor:'#C9A84C',
    textColor:'#5A2A3A',
    subColor:'#8B5A5A',
    qrBorderColor:'#C9A84C',
    stepIconBg:'#FDE8EE',
    stepIconColor:'#C84A6A',
    hasFlowers:true,
    flowerStyle:'pink',
    hasLantern:true,
    hasRings:true,
  },
  {
    id:'floral-rose',
    name:'Rose Garden',
    style:'Soft & Romantic',
    previewBg:'linear-gradient(135deg,#FDF0F4,#F8E0E8)',
    previewAcc:'#D4406A',
    previewIcon:'🌹',
    bg:'#FEF0F4',
    bgGrad:['#FEF0F4','#FAE0EC','#FDF6F8'],
    titleColor:'#B83A5A',
    accentColor:'#C9A84C',
    textColor:'#4A1A2A',
    subColor:'#7A3A4A',
    qrBorderColor:'#B83A5A',
    stepIconBg:'#FCE0EA',
    stepIconColor:'#B83A5A',
    hasFlowers:true,
    flowerStyle:'rose',
    hasLantern:false,
    hasRings:false,
  },
  {
    id:'royal-dark',
    name:'Royal Dark',
    style:'Luxury Gold',
    previewBg:'linear-gradient(135deg,#1A0A0A,#2A1A00)',
    previewAcc:'#E8C87A',
    previewIcon:'👑',
    bg:'#1A0A0A',
    bgGrad:['#1A0A0A','#2A1400','#1A0A0A'],
    titleColor:'#E8C87A',
    accentColor:'#C9A84C',
    textColor:'#FFFFFF',
    subColor:'rgba(232,200,122,0.7)',
    qrBorderColor:'#C9A84C',
    stepIconBg:'rgba(232,200,122,0.1)',
    stepIconColor:'#E8C87A',
    hasFlowers:false,
    flowerStyle:'none',
    hasLantern:false,
    hasRings:false,
    isDark:true,
  },
  {
    id:'maroon-gold',
    name:'Traditional',
    style:'Maroon & Gold',
    previewBg:'linear-gradient(135deg,#2A0808,#1A0A00)',
    previewAcc:'#FFD700',
    previewIcon:'🕌',
    bg:'#FFF8F0',
    bgGrad:['#FFF8F0','#FFE8D0','#FFF8F0'],
    titleColor:'#8B1A1A',
    accentColor:'#C9A84C',
    textColor:'#3A1A08',
    subColor:'#6A3A08',
    qrBorderColor:'#8B1A1A',
    stepIconBg:'#FFE8D0',
    stepIconColor:'#8B1A1A',
    hasFlowers:true,
    flowerStyle:'orange',
    hasLantern:true,
    hasRings:true,
  },
  {
    id:'whatsapp-green',
    name:'WhatsApp Style',
    style:'Modern & Fresh',
    previewBg:'linear-gradient(135deg,#FDF6EC,#E8F5E0)',
    previewAcc:'#25D366',
    previewIcon:'💬',
    bg:'#F8FDF6',
    bgGrad:['#F8FDF6','#EDF8E8','#F8FDF6'],
    titleColor:'#1A7A3A',
    accentColor:'#25D366',
    textColor:'#0A3A18',
    subColor:'#2A6A38',
    qrBorderColor:'#25D366',
    stepIconBg:'#D0F0DC',
    stepIconColor:'#1A7A3A',
    hasFlowers:true,
    flowerStyle:'green',
    hasLantern:false,
    hasRings:false,
    isWA:true,
  },
  {
    id:'night-sky',
    name:'Night Sky',
    style:'Deep Blue Stars',
    previewBg:'linear-gradient(135deg,#040820,#08082A)',
    previewAcc:'#89B4FF',
    previewIcon:'🌙',
    bg:'#040820',
    bgGrad:['#040820','#08082A','#040820'],
    titleColor:'#89B4FF',
    accentColor:'#6A9ADA',
    textColor:'#FFFFFF',
    subColor:'rgba(137,180,255,0.7)',
    qrBorderColor:'#6A9ADA',
    stepIconBg:'rgba(137,180,255,0.1)',
    stepIconColor:'#89B4FF',
    hasFlowers:false,
    flowerStyle:'none',
    hasLantern:false,
    hasRings:false,
    isDark:true,
    hasStars:true,
  },
];

// Build template grid
function buildGrid() {
  const g = document.getElementById('tmplGrid');
  g.innerHTML = '';
  TEMPLATES.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tc' + (t.id === selectedTemplate ? ' sel' : '');
    d.innerHTML = `<div class="tc-inner" style="background:${t.previewBg}">
      <span style="font-size:20px;position:relative;z-index:1">${t.previewIcon}</span>
      <span class="tc-name" style="color:${t.previewAcc}">${t.name}</span>
      <span class="tc-style" style="color:${t.isDark?'rgba(255,255,255,0.4)':'rgba(0,0,0,0.35)'}">${t.style}</span>
    </div>
    <div class="tc-check">✓</div>`;
    d.onclick = () => {
      selectedTemplate = t.id;
      buildGrid();
      renderCard();
    };
    g.appendChild(d);
  });
}

// ── MAIN RENDER ──
async function renderCard() {
  const tmpl = TEMPLATES.find(t => t.id === selectedTemplate) || TEMPLATES[0];
  const eventName = document.getElementById('eventName').value || 'Your Wedding';
  const eventUrl = document.getElementById('eventUrl').value || 'https://www.templecity.digital';

  const canvas = document.getElementById('qrCanvas');
  const W = 600, H = 850; // Portrait format like reference images
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, tmpl.bgGrad[0]);
  bgGrad.addColorStop(0.5, tmpl.bgGrad[1]);
  bgGrad.addColorStop(1, tmpl.bgGrad[2]);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Stars for night sky
  if(tmpl.hasStars) {
    for(let i=0;i<120;i++) {
      ctx.beginPath();
      ctx.arc(Math.random()*W, Math.random()*H, Math.random()*1.5, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.5+0.1})`;
      ctx.fill();
    }
  }

  // Floral decorations
  if(tmpl.hasFlowers) {
    drawFloralCorners(ctx, W, H, tmpl.flowerStyle);
  }

  // Gold border frame
  const borderColor = tmpl.isDark ? 'rgba(232,200,122,0.3)' : 'rgba(201,168,76,0.35)';
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(18, 18, W-36, H-36);
  ctx.lineWidth = 0.5;
  ctx.strokeRect(24, 24, W-48, H-48);

  // Lantern for floral themes
  if(tmpl.hasLantern) {
    drawLantern(ctx, W-70, 60, tmpl.accentColor);
  }

  // Rings / header ornament
  if(tmpl.hasRings) {
    drawRings(ctx, W/2, 70, tmpl.accentColor);
  } else {
    // Simple ornament
    drawOrnament(ctx, W/2, 60, tmpl.titleColor);
  }

  // "Our Wedding Memories" title
  ctx.fillStyle = tmpl.titleColor;
  ctx.font = `700 italic 32px Dancing Script, cursive`;
  ctx.textAlign = 'center';
  ctx.fillText('Our Wedding Memories', W/2, 120);

  // Decorative line under title
  drawDecorLine(ctx, W/2, 135, 200, tmpl.accentColor);

  // Main headline
  ctx.fillStyle = tmpl.isDark ? 'white' : tmpl.textColor;
  ctx.font = `800 26px Montserrat, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('SCAN • TAKE SELFIE', W/2, 185);

  ctx.fillStyle = tmpl.titleColor;
  ctx.font = `800 38px Montserrat, sans-serif`;
  ctx.fillText('GET YOUR PHOTOS', W/2, 235);

  // Subheading
  drawDecorLine(ctx, W/2, 255, 160, tmpl.accentColor);
  ctx.fillStyle = tmpl.isDark ? 'rgba(255,255,255,0.5)' : tmpl.subColor;
  ctx.font = `600 14px Montserrat, sans-serif`;
  ctx.letterSpacing = '0.1em';
  ctx.fillText('NO NEED TO WAIT!', W/2, 278);
  ctx.letterSpacing = '0';

  // WhatsApp badge (for WA template) or SCAN NOW button
  if(tmpl.isWA) {
    // WhatsApp button style
    ctx.fillStyle = '#25D366';
    roundRect2(ctx, W/2-130, 292, 260, 44, 8);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = `700 16px Montserrat, sans-serif`;
    ctx.fillText('💬  WHATSAPP BOT', W/2, 320);
  } else {
    // Scan Now button
    ctx.fillStyle = tmpl.titleColor;
    roundRect2(ctx, W/2-110, 292, 220, 40, 6);
    ctx.fill();
    ctx.fillStyle = tmpl.isDark ? '#0A0806' : 'white';
    ctx.font = `800 16px Montserrat, sans-serif`;
    ctx.fillText('SCAN NOW', W/2, 318);
    // Side arrows
    ctx.fillStyle = tmpl.accentColor;
    ctx.font = '14px serif';
    ctx.fillText('›', W/2-130, 318);
    ctx.fillText('‹', W/2+125, 318);
  }

  // QR Code section
  const qrSize = 220;
  const qrX = (W - qrSize) / 2;
  const qrY = 348;

  // QR outer frame
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  roundRect2(ctx, qrX-16, qrY-16, qrSize+32, qrSize+32, 16);
  ctx.fill();
  ctx.strokeStyle = tmpl.qrBorderColor;
  ctx.lineWidth = 2;
  roundRect2(ctx, qrX-16, qrY-16, qrSize+32, qrSize+32, 16);
  ctx.stroke();

  // Draw QR
  await drawQR(ctx, eventUrl, qrX, qrY, qrSize);

  // Camera icon in center of QR
  drawCameraIcon(ctx, W/2, qrY+qrSize/2, 30, tmpl.titleColor);

  // Event code / name below QR
  ctx.fillStyle = tmpl.isDark ? 'rgba(255,255,255,0.4)' : tmpl.subColor;
  ctx.font = `500 12px Montserrat, sans-serif`;
  ctx.textAlign = 'center';
  const shortName = eventName.length > 25 ? eventName.substring(0, 22) + '...' : eventName;
  ctx.fillText(`Event: ${shortName}`, W/2, qrY + qrSize + 30);

  // Steps section
  const stepsY = qrY + qrSize + 60;
  drawSteps(ctx, W, stepsY, tmpl);

  // Thank you message
  const tyY = stepsY + 120;
  ctx.fillStyle = tmpl.titleColor;
  ctx.font = `600 italic 18px Dancing Script, cursive`;
  ctx.textAlign = 'center';
  ctx.fillText('Thank you for being part of our special day!', W/2, tyY);
  // Heart
  ctx.fillStyle = tmpl.titleColor;
  ctx.font = '14px serif';
  ctx.fillText('♥', W/2, tyY + 20);

  // Footer brand
  const footerY = H - 36;
  drawDecorLine(ctx, W/2, footerY - 24, 160, tmpl.accentColor);
  ctx.fillStyle = tmpl.isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.3)';
  ctx.font = `400 9px Montserrat, sans-serif`;
  ctx.letterSpacing = '0.05em';
  ctx.fillText('Powered by  PhotoFind Pro  •  AI Face Recognition Technology', W/2, footerY);
  ctx.letterSpacing = '0';
}

// ── DRAW HELPERS ──

function drawFloralCorners(ctx, W, H, style) {
  const colors = {
    pink: ['#FFB6C1','#FF8FA3','#FFCCD5','#E8A0B0'],
    rose: ['#E8909A','#C87080','#F0A0B0','#D88090'],
    orange: ['#FFD080','#FFA040','#FFE0A0','#FFC060'],
    green: ['#90C090','#60A060','#A0D0A0','#70B070'],
  };
  const c = colors[style] || colors.pink;

  // Draw decorative floral elements using canvas
  // Top-left corner flowers
  for(let i=0;i<8;i++){
    const angle = (i/8)*Math.PI*0.6 - 0.1;
    const r = 60+Math.random()*40;
    const x = 20 + Math.cos(angle)*r;
    const y = 20 + Math.sin(angle)*r;
    drawFlower(ctx, x, y, 8+Math.random()*12, c[i%c.length]);
  }
  // Top-right corner
  for(let i=0;i<8;i++){
    const angle = Math.PI - (i/8)*Math.PI*0.6 + 0.1;
    const r = 60+Math.random()*40;
    const x = W-20 + Math.cos(angle)*r;
    const y = 20 + Math.sin(angle)*r;
    drawFlower(ctx, x, y, 8+Math.random()*12, c[i%c.length]);
  }
  // Bottom-left corner
  for(let i=0;i<6;i++){
    const angle = -0.1 + (i/6)*Math.PI*0.5;
    const r = 50+Math.random()*35;
    const x = 20 + Math.cos(angle)*r;
    const y = H-20 - Math.sin(angle)*r;
    drawFlower(ctx, x, y, 7+Math.random()*10, c[i%c.length]);
  }
  // Bottom-right corner
  for(let i=0;i<6;i++){
    const angle = Math.PI + 0.1 - (i/6)*Math.PI*0.5;
    const r = 50+Math.random()*35;
    const x = W-20 + Math.cos(angle)*r;
    const y = H-20 - Math.sin(angle)*r;
    drawFlower(ctx, x, y, 7+Math.random()*10, c[i%c.length]);
  }
  // Leaves
  drawLeaves(ctx, W, H, style);
}

function drawFlower(ctx, x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.rotate(Math.PI*2/5);
    ctx.ellipse(0, -r*0.7, r*0.4, r*0.7, 0, 0, Math.PI*2);
    ctx.fillStyle = color+'CC';
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, 0, r*0.3, 0, Math.PI*2);
  ctx.fillStyle = '#FFD700AA';
  ctx.fill();
  ctx.restore();
}

function drawLeaves(ctx, W, H, style) {
  const lc = style==='green' ? '#60A060' : '#7A9A5A';
  const positions = [[40,80],[W-40,80],[30,H-80],[W-30,H-80],[60,150],[W-60,150]];
  positions.forEach(([x,y]) => {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(Math.random()*Math.PI*2);
    ctx.beginPath();
    ctx.ellipse(0,0,5,15,0,0,Math.PI*2);
    ctx.fillStyle = lc+'88';
    ctx.fill();
    ctx.restore();
  });
}

function drawLantern(ctx, x, y, color) {
  ctx.save();
  ctx.translate(x, y);
  // Chain
  ctx.strokeStyle = color+'80';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,-40); ctx.lineTo(0,0); ctx.stroke();
  // Lantern body
  ctx.fillStyle = color+'40';
  ctx.strokeStyle = color+'80';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-15,0); ctx.lineTo(-20,40); ctx.lineTo(20,40); ctx.lineTo(15,0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // Glow
  const glow = ctx.createRadialGradient(0,20,0,0,20,25);
  glow.addColorStop(0,'rgba(255,220,100,0.3)');
  glow.addColorStop(1,'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(-25,-5,50,50);
  ctx.restore();
}

function drawRings(ctx, x, y, color) {
  ctx.save();
  ctx.translate(x, y);
  // Two interlocked rings
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(-10, 0, 14, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(10, 0, 14, 0, Math.PI*2); ctx.stroke();
  // Diamond on top
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(-5,-16); ctx.lineTo(0,-10); ctx.lineTo(5,-16); ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawOrnament(ctx, x, y, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.font = '18px serif';
  ctx.textAlign = 'center';
  ctx.fillText('✦', 0, 0);
  ctx.font = '11px serif';
  ctx.fillText('❖', -24, 0);
  ctx.fillText('❖', 24, 0);
  ctx.restore();
}

function drawDecorLine(ctx, x, y, halfW, color) {
  const g = ctx.createLinearGradient(x-halfW, y, x+halfW, y);
  g.addColorStop(0, 'transparent');
  g.addColorStop(0.4, color+'80');
  g.addColorStop(0.5, color);
  g.addColorStop(0.6, color+'80');
  g.addColorStop(1, 'transparent');
  ctx.strokeStyle = g;
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(x-halfW, y); ctx.lineTo(x+halfW, y); ctx.stroke();
  // Center diamond
  ctx.fillStyle = color;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.PI/4);
  ctx.fillRect(-3,-3,6,6);
  ctx.restore();
}

function drawCameraIcon(ctx, x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  // Circle background
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
  // Camera icon
  ctx.fillStyle = 'white';
  ctx.font = `${r}px serif`;
  ctx.textAlign = 'center';
  ctx.fillText('📷', 0, r*0.35);
  ctx.restore();
}

function drawSteps(ctx, W, y, tmpl) {
  const steps = [
    { icon:'📱', title:'1. SCAN QR CODE', sub:'Scan the QR code\nfrom your phone' },
    { icon:'🤳', title:'2. TAKE SELFIE', sub:'Take a quick selfie\nfor face recognition' },
    { icon:'📸', title:'3. GET PHOTOS', sub:'Instantly get\nyour photos!' },
  ];

  const stepW = W / 3;
  steps.forEach((step, i) => {
    const cx = stepW * i + stepW/2;

    // Circle
    ctx.beginPath(); ctx.arc(cx, y+20, 24, 0, Math.PI*2);
    ctx.fillStyle = tmpl.stepIconBg;
    ctx.fill();
    ctx.strokeStyle = tmpl.stepIconColor+'60';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.font = '18px serif';
    ctx.textAlign = 'center';
    ctx.fillText(step.icon, cx, y+28);

    // Arrow between steps
    if(i < 2) {
      ctx.fillStyle = tmpl.accentColor+'80';
      ctx.font = 'bold 16px serif';
      ctx.fillText('›', cx + stepW/2, y+26);
    }

    // Title
    ctx.fillStyle = tmpl.stepIconColor;
    ctx.font = `700 10px Montserrat, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(step.title, cx, y+60);

    // Sub text
    ctx.fillStyle = tmpl.isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.35)';
    ctx.font = `300 9px Montserrat, sans-serif`;
    step.sub.split('\n').forEach((line, li) => {
      ctx.fillText(line, cx, y+75+li*13);
    });
  });
}

async function drawQR(ctx, url, x, y, size) {
  return new Promise(resolve => {
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}&margin=6&color=000000&bgcolor=ffffff`;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { ctx.drawImage(img, x, y, size, size); resolve(); };
    img.onerror = () => {
      ctx.fillStyle = '#f8f8f8';
      ctx.fillRect(x, y, size, size);
      ctx.fillStyle = '#333';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('QR Code', x+size/2, y+size/2);
      resolve();
    };
    img.src = qrUrl;
  });
}

function roundRect2(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// Actions
function downloadCard() {
  const canvas = document.getElementById('qrCanvas');
  const name = document.getElementById('eventName').value || 'Event';
  const a = document.createElement('a');
  a.download = `QRCard-${name.replace(/\s+/g,'-')}-PhotoFindPro.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  showToast('✅ QR Card downloaded!');
}

function copyLink() {
  const url = document.getElementById('eventUrl').value;
  if(!url){showToast('Please enter event URL!');return;}
  navigator.clipboard.writeText(url).then(()=>showToast('✅ Link copied!'));
}

function shareWA() {
  const url = document.getElementById('eventUrl').value;
  const name = document.getElementById('eventName').value || 'our event';
  const msg = `📸 *Find Your Photos — ${name}*\n\nScan QR or open this link:\n${url||'https://www.templecity.digital'}\n\n1️⃣ Open link\n2️⃣ Take selfie\n3️⃣ Get your photos instantly! ✨\n\n_Powered by PhotoFind Pro_`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Auto re-render on input change
document.getElementById('eventName').addEventListener('input', ()=>renderCard());
document.getElementById('eventUrl').addEventListener('input', ()=>renderCard());

// Init
buildGrid();
renderCard();
</script>
